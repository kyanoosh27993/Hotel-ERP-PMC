name: CI — Hotel ERP (Phases 1–3)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# اجراهای هم‌زمان روی یک شاخه: فقط جدیدترین اجرا بماند تا صف قرمز نسازد
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  quality:
    name: Lint + Build + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma generate (required for API build)
        run: npm run prisma:generate -w apps/api
      - name: Lint
        run: npm run lint
      - name: Build (shared → contracts → payroll → api)
        run: npm run build -w packages/shared && npm run build -w packages/contracts && npm run build -w packages/payroll && npm run build -w apps/api
      - name: Unit tests
        run: npm run test:unit -w packages/shared && npm run test:unit -w packages/payroll && npm run test:unit -w apps/api

  e2e:
    name: E2E (PostgreSQL service) — core acceptance
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel_ci_pass
          POSTGRES_DB: hotel_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://hotel:hotel_ci_pass@localhost:5432/hotel_erp?schema=public
      JWT_ACCESS_SECRET: e2e-access-secret-change-me
      MFA_TEST_SECRET: JBSWY3DPEHPK3PXPE2ETEST
      SEED_ADMIN_PASSWORD: ChangeMe_Str0ng!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build shared + contracts + payroll (type declarations needed by e2e ts-jest)
        run: npm run build -w packages/shared && npm run build -w packages/contracts && npm run build -w packages/payroll
      - name: Prisma generate
        run: npm run prisma:generate -w apps/api
      - name: Migrate deploy (validates migration SQL)
        run: npm run prisma:migrate -w apps/api
      - name: Seed (roles/matrix/users/rules/payroll)
        run: npm run db:seed -w apps/api
      - name: E2E tests (auth/RBAC/outbox/concurrency/POS→journal/payroll→journal)
        run: npm run test:e2e -w apps/api

  infra:
    name: Compose config + Backup/Restore round-trip
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel_ci_pass
          POSTGRES_DB: hotel_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://hotel:hotel_ci_pass@localhost:5432/hotel_erp
      BACKUP_PASSPHRASE: ci_backup_passphrase_test
      BACKUP_DIR: /tmp/ci-backups
      BACKUP_KEEP_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose syntax
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Backup → verify → wipe → restore round-trip (in postgres:16 container for tool parity)
        run: |
          chmod +x infrastructure/backup/*.sh
          psql "$DATABASE_URL" -c 'CREATE TABLE ci_probe(id int primary key); INSERT INTO ci_probe VALUES (42);'
          docker run --rm --network host -v /tmp:/tmp -v "$PWD":/app -w /app \
            -e DATABASE_URL -e BACKUP_PASSPHRASE -e BACKUP_DIR=/tmp/ci-backups \
            postgres:16-alpine sh -c "apk add -q --no-cache openssl >/dev/null && sh infrastructure/backup/backup.sh"
          psql "$DATABASE_URL" -c 'DROP TABLE ci_probe;'
          BK="$(ls /tmp/ci-backups/*.enc | head -1)"
          docker run --rm --network host -v /tmp:/tmp -v "$PWD":/app -w /app \
            -e DATABASE_URL -e BACKUP_PASSPHRASE \
            postgres:16-alpine sh -c "apk add -q --no-cache openssl >/dev/null && sh infrastructure/backup/restore.sh $BK"
          COUNT=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM ci_probe;')
          [ "$COUNT" = "1" ] && echo "restore round-trip OK (probe=42)" || { echo "restore FAILED"; exit 1; }
