name: Release — Android APK (Hotel ERP)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK (Capacitor WebView + web shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile deps
        run: npm install --no-audit --no-fund
        working-directory: apps/mobile
      - name: Copy web shell into Android assets
        run: npx cap sync android
        working-directory: apps/mobile
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk Hotel-ERP-Android.apk
        working-directory: apps/mobile
      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-ERP-Android-apk
          path: apps/mobile/Hotel-ERP-Android.apk
      - name: Attach APK to the GitHub Release of this tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/Hotel-ERP-Android.apk
