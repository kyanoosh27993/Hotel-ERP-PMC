name: Release — Windows Setup.exe (Hotel ERP)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    name: Build + smoke-test Persian installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NODE_VERSION_BUNDLE: v22.20.0
      # کپچا (U1) برای لاگین ماشینیِ smoke خاموش می‌شود؛ کاربر واقعی در نصب خودش کپچا دارد
      AUTH_CAPTCHA_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4

      # ── گیت انکودینگ (باگ #۸): اسکریپت‌های NSIS باید UTF-8 با BOM باشند ──
      # بدون BOM، makensis فایل را با صفحه‌کد ANSI می‌خواند و متن فارسی
      # به‌صورت «â€"» و «Ø³ÛŒ...» داخل Setup.exe پخته می‌شود.
      - name: Gate — NSIS scripts must be UTF-8 with BOM (Persian text integrity)
        shell: pwsh
        run: |
          foreach ($f in @("installer.nsi", "launcher.nsi")) {
            $p = "infrastructure\desktop\$f"
            $b = [System.IO.File]::ReadAllBytes($p)
            if (-not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
              throw "GATE FAILED: $f is missing UTF-8 BOM — Persian strings would be corrupted (bug #8). Save the file as UTF-8 with BOM."
            }
            Write-Host "BOM OK — $f"
          }
          # باگ #۱۲ — فارسی کنسول: run-server.cmd و boot.cmd (داخل server.js) باید chcp 65001 بگذارند
          $cmd = Get-Content "infrastructure\desktop\run-server.cmd" -Raw
          if ($cmd -notmatch 'chcp 65001') { throw "GATE FAILED: run-server.cmd is missing chcp 65001 — Persian console output would be garbled" }
          $srv = Get-Content "infrastructure\desktop\server.js" -Raw
          if ($srv -notmatch 'chcp 65001 >nul') { throw "GATE FAILED: server.js boot.cmd (deElevated console) is missing chcp 65001 >nul" }
          if ($srv -notmatch "execSync\('chcp 65001'") { throw "GATE FAILED: server.js boot-time chcp 65001 missing" }
          Write-Host "CODEPAGE GATE OK — Persian console rendering guarded"
          # باگ #۱۴/#۱۵/#۱۶ — فایل‌های جدیدِ لانچر باید در سورس موجود باشند
          foreach ($f in @("infrastructure\desktop\schema-sync.js", "infrastructure\desktop\stop-app.ps1")) {
            if (-not (Test-Path $f)) { throw "GATE FAILED: $f missing — launcher cannot boot/uninstall correctly" }
          }
          $sync = Get-Content "infrastructure\desktop\server.js" -Raw
          if ($sync -notmatch "schema-sync\.js") { throw "GATE FAILED: server.js does not load schema-sync.js" }
          if ($sync -notmatch "stopPgFast") { throw "GATE FAILED: server.js missing stopPgFast (bug #14 — orphan PG)" }
          Write-Host "LAUNCHER FILES GATE OK — schema-sync.js + stop-app.ps1 present, server.js wired"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci --no-audit --no-fund

      - name: Build shared/contracts/payroll/api (Windows-native Prisma + Argon2 engines)
        run: |
          npm run build -w packages/shared
          npm run build -w packages/contracts
          npm run build -w packages/payroll
          npm run prisma:generate -w apps/api
          npm run build -w apps/api

      # ── مونتاژ payload ──
      - name: Assemble payload
        run: |
          mkdir -p infrastructure/desktop/payload/api infrastructure/desktop/payload/web infrastructure/desktop/payload/node infrastructure/desktop/out
          cp -r apps/api/dist infrastructure/desktop/payload/api/dist
          cp -r apps/api/prisma infrastructure/desktop/payload/api/prisma
          cp -r apps/web/. infrastructure/desktop/payload/web/
          cp infrastructure/desktop/server.js infrastructure/desktop/payload/server.js
          cp infrastructure/desktop/run-server.cmd infrastructure/desktop/payload/run-server.cmd
          cp infrastructure/desktop/schema-sync.js infrastructure/desktop/payload/schema-sync.js
          test -f infrastructure/desktop/payload/schema-sync.js || { echo "GATE FAILED: schema-sync.js missing from payload"; exit 1; }
          test -f infrastructure/desktop/stop-app.ps1 || { echo "GATE FAILED: stop-app.ps1 missing from source (needed at NSIS compile time)"; exit 1; }
          mkdir -p infrastructure/desktop/payload/api/node_modules/@hotel-erp/shared infrastructure/desktop/payload/api/node_modules/@hotel-erp/contracts infrastructure/desktop/payload/api/node_modules/@hotel-erp/payroll
          cp -r packages/shared/dist packages/shared/package.json infrastructure/desktop/payload/api/node_modules/@hotel-erp/shared/
          cp -r packages/contracts/dist packages/contracts/package.json infrastructure/desktop/payload/api/node_modules/@hotel-erp/contracts/
          cp -r packages/payroll/dist packages/payroll/package.json infrastructure/desktop/payload/api/node_modules/@hotel-erp/payroll/
          # compile seed (ts-node نخواهیم داشت — JS کامپایل‌شده)
          npx tsc apps/api/prisma/seed.ts apps/api/src/iam/permissions.ts --outDir infrastructure/desktop/payload/api/seed --module commonjs --target es2020 --esModuleInterop --skipLibCheck --moduleResolution node

      - name: Install runtime deps (Windows-native) into payload
        working-directory: infrastructure/desktop/payload/api
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('../../../../apps/api/package.json','utf8'));fs.writeFileSync('package.json',JSON.stringify({name:'hotel-erp-runtime',version:'0.5.0',private:true,dependencies:p.dependencies},null,2))"
          npm install --omit=dev --no-audit --no-fund
          # پین PostgreSQL 19 — باگ #۱۲: خوشهٔ datadir کارفرما با PG19 ساخته شده بود و
          # باندل ۱۸٫۷ آن را باز نمی‌کرد (database files are incompatible with server).
          npm install --no-save --no-audit --no-fund embedded-postgres@19.0.0-beta.20 prisma@5.22.0
          # تولید کلاینت Prisma داخل payload (بدون این، seed و API خطای
          # "@prisma/client did not initialize yet" می‌دهند)
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          # باگ #۱۱ — npm پکیج‌های extraneous را prune می‌کند و @hotel-erp/payroll از
          # payload حذف می‌شد (تست دود به‌خاطر node_modules ریشهٔ مونوریپو جواب دروغی
          # می‌گرفت). کپی مجدد سه پکیج workspace پس از npm install + گیت سخت.
          for p in shared contracts payroll; do
            rm -rf "node_modules/@hotel-erp/$p"
            mkdir -p "node_modules/@hotel-erp/$p"
            cp -r "../../../../packages/$p/dist" "../../../../packages/$p/package.json" "node_modules/@hotel-erp/$p/"
            test -f "node_modules/@hotel-erp/$p/package.json" || { echo "GATE FAILED: @hotel-erp/$p is missing from payload"; exit 1; }
          done
          echo "PAYLOAD PACKAGES OK — @hotel-erp/{shared,contracts,payroll} present"

      # ── گیت نسخهٔ PG (باگ #۱۲): نسخهٔ واقعی باینری باندل‌شده باید با پین یکی باشد ──
      - name: Gate — bundled PostgreSQL major must match the pin
        shell: pwsh
        run: |
          $pgctl = "infrastructure\desktop\payload\api\node_modules\@embedded-postgres\windows-x64\native\bin\pg_ctl.exe"
          if (-not (Test-Path $pgctl)) { throw "pg_ctl.exe missing from payload" }
          $v = & $pgctl --version
          Write-Host "bundled: $v"
          if ($v -notmatch "PostgreSQL\) 19\.") { throw "GATE FAILED: bundled PostgreSQL major is not 19 (pin: embedded-postgres@19.0.0-beta.20) — version drift breaks existing customer datadirs" }
          Write-Host "PG MAJOR GATE OK — 19"

      - name: Download portable node.exe
        run: |
          curl -sL "https://nodejs.org/dist/${NODE_VERSION_BUNDLE}/node-${NODE_VERSION_BUNDLE}-win-x64.zip" -o node.zip
          unzip -q node.zip -d nodezip
          cp "nodezip/node-${NODE_VERSION_BUNDLE}-win-x64/node.exe" infrastructure/desktop/payload/node/node.exe
          rm -rf node.zip nodezip

      - name: Install NSIS
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "choco install attempt $i failed — retrying in 20s"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw "choco install nsis failed after 3 attempts (network flake?)" }

      - name: Compile launcher + Persian installer
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          Set-Location "infrastructure\desktop"
          & $nsis "launcher.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis launcher.nsi failed (exit $LASTEXITCODE)" }
          Copy-Item "out\HotelERP.exe" "payload\HotelERP.exe"
          & $nsis "installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis installer.nsi failed (exit $LASTEXITCODE)" }
          Set-Location $env:GITHUB_WORKSPACE
          Get-Item "infrastructure\desktop\out\Hotel-ERP-Setup.exe" | Select-Object Name,Length

      # ── تست اجرای واقعی روی ویندوز (الزام کارفرما: exe باید باز شود) ──
      - name: Smoke test — boot server on real Windows
        shell: pwsh
        run: |
          $env:HOTELERP_PORT = "3300"
          $env:HOTELERP_DATA_DIR = "$env:RUNNER_TEMP\smoke-data"
          # U1 کپچای سرور در smoke ماشینی است — فقط برای این بوت خاموش می‌شود (کاربر واقعی کپچا دارد)
          $env:AUTH_CAPTCHA_REQUIRED = "false"
          $p = Start-Process -FilePath "infrastructure\desktop\payload\node\node.exe" -ArgumentList "infrastructure\desktop\payload\server.js" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\smoke-out.log" -RedirectStandardError "$env:RUNNER_TEMP\smoke-err.log"
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod -Uri "http://localhost:3300/api/v1/health" -TimeoutSec 3
              if ($h.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-Content "$env:RUNNER_TEMP\smoke-out.log","$env:RUNNER_TEMP\smoke-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            Get-ChildItem "$env:RUNNER_TEMP\smoke-data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 35 }
            Write-Host "--- pg-server.log ---"; Get-Content "$env:RUNNER_TEMP\smoke-data\logs\pg-server.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host "--- boot.cmd ---"; Get-Content "$env:RUNNER_TEMP\smoke-data\boot.cmd" -ErrorAction SilentlyContinue
            Write-Host "--- schtasks status ---"; schtasks /query /tn "HotelERP Limited Run" /v /fo list 2>$null | Select-Object -Last 12
            taskkill /PID $($p.Id) /T /F 2>$null
            Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "Server did not become healthy on real Windows"
          }
          Write-Host "HEALTH OK"
          # ورود کاربر پذیرش (seed خودکار با Admin@Hotel1)
          $login = Invoke-RestMethod -Uri "http://localhost:3300/api/v1/auth/login" -Method Post -ContentType "application/json" -Body '{"username":"frontdesk","password":"Admin@Hotel1"}'
          if (-not $login.accessToken) { throw "login failed" }
          $map = Invoke-RestMethod -Uri "http://localhost:3300/api/v1/pms/rooms/map" -Headers @{ Authorization = "Bearer $($login.accessToken)" }
          if ($map.data.floors.Count -ne 3) { throw "PMS room map wrong" }
          Write-Host "PMS MAP OK — rooms: $($map.data.summary.AVAILABLE) available"
          $web = Invoke-WebRequest -Uri "http://localhost:3300/" -UseBasicParsing
          if ($web.Content -notmatch "frontdesk.js") { throw "web shell not served" }
          Write-Host "WEB SHELL OK"
          taskkill /PID $($p.Id) /T /F 2>$null
          Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
          schtasks /delete /tn "HotelERP Limited Run" /f 2>$null | Out-Null
          Write-Host "SMOKE TEST PASSED — boot + login + PMS + web shell on real Windows"

      # ── تست ریکاوری (باگ #۱۲): خوشهٔ موجود با نسخهٔ متفاوت PostgreSQL → بکاپ خودکار + بوت موفق ──
      # شبیه‌سازی دقیق دستگاه کارفرما: datadir ساخته‌شده با PG دیگر؛ سرور باید خودش را
      # بازسازی کند (بکاپ pgdata-old-PG17-* + initdb تازه) نه اینکه با FATAL بمیرد.
      - name: Recovery test — incompatible datadir version self-heals
        shell: pwsh
        run: |
          $vf = "$env:RUNNER_TEMP\smoke-data\pgdata\PG_VERSION"
          if (-not (Test-Path $vf)) { throw "smoke datadir missing from previous step" }
          Set-Content -Path $vf -Value "17" -NoNewline
          $env:HOTELERP_PORT = "3300"
          $env:HOTELERP_DATA_DIR = "$env:RUNNER_TEMP\smoke-data"
          $env:AUTH_CAPTCHA_REQUIRED = "false"
          $p = Start-Process -FilePath "infrastructure\desktop\payload\node\node.exe" -ArgumentList "infrastructure\desktop\payload\server.js" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\rec-out.log" -RedirectStandardError "$env:RUNNER_TEMP\rec-err.log"
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod -Uri "http://localhost:3300/api/v1/health" -TimeoutSec 3
              if ($h.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-Content "$env:RUNNER_TEMP\rec-out.log","$env:RUNNER_TEMP\rec-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-ChildItem "$env:RUNNER_TEMP\smoke-data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 30 }
            Write-Host "--- pg-server.log ---"; Get-Content "$env:RUNNER_TEMP\smoke-data\logs\pg-server.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
            Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "recovery boot failed after datadir version-mismatch simulation"
          }
          $bak = Get-ChildItem "$env:RUNNER_TEMP\smoke-data" -Directory -Filter "pgdata-old-PG17-*"
          if (-not $bak) { throw "recovery backup (pgdata-old-PG17-*) was not created — self-heal logic missing" }
          Write-Host "RECOVERY OK — backup: $($bak.Name) — server healthy after version-mismatch self-heal"
          taskkill /PID $($p.Id) /T /F 2>$null
          Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force

      # ── تست نصب واقعی + معادل دابل‌کلیک (باگ #۹): Setup را روی Program Files نصب
      #    می‌کنیم و سپس دقیقاً همان exe نصب‌شده (مسیر دابل‌کلیک کاربر) را اجرا می‌کنیم ──
      - name: Install test — silent setup + double-click equivalent on real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath "infrastructure\desktop\out\Hotel-ERP-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup.exe /S exited with $($p.ExitCode)" }
          $inst = "C:\Program Files\HotelERP"
          foreach ($f in @("HotelERP.exe", "run-server.cmd", "server.js", "node\node.exe", "Uninstall.exe")) {
            if (-not (Test-Path (Join-Path $inst $f))) { throw "installed file missing: $f" }
          }
          foreach ($d in @("web", "api")) {
            if (-not (Test-Path (Join-Path $inst $d))) { throw "installed folder missing: $d" }
          }
          Write-Host "INSTALL OK — files present in $inst"
          # معادل دابل‌کلیک کاربر: اجرای HotelERP.exe نصب‌شده (نه node مستقیم)
          Start-Process -FilePath "$inst\HotelERP.exe"
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod -Uri "http://localhost:3000/api/v1/health" -TimeoutSec 3
              if ($h.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-ChildItem "$env:APPDATA\HotelERP\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 35 }
            Write-Host "--- pg-server.log ---"; Get-Content "$env:APPDATA\HotelERP\logs\pg-server.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host "--- boot.cmd ---"; Get-Content "$env:APPDATA\HotelERP\boot.cmd" -ErrorAction SilentlyContinue
            Write-Host "--- schtasks ---"; schtasks /query /tn "HotelERP Limited Run" /v /fo list 2>$null | Select-Object -Last 12
            Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "Installed app did not become healthy on port 3000 after double-click launch"
          }
          Write-Host "DOUBLE-CLICK LAUNCH OK — installed exe booted the server on port 3000"
          $login = Invoke-RestMethod -Uri "http://localhost:3000/api/v1/auth/login" -Method Post -ContentType "application/json" -Body '{"username":"frontdesk","password":"Admin@Hotel1"}'
          if (-not $login.accessToken) { throw "installed app login failed" }
          $map = Invoke-RestMethod -Uri "http://localhost:3000/api/v1/pms/rooms/map" -Headers @{ Authorization = "Bearer $($login.accessToken)" }
          if ($map.data.floors.Count -ne 3) { throw "installed app PMS map wrong" }
          $web = Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing
          if ($web.Content -notmatch "frontdesk.js") { throw "installed web shell not served" }
          Write-Host "INSTALLED APP FUNCTIONAL OK — login + PMS map + web shell"
          # پاکسازی کامل: توقف فرایندها، حذف وظیفهٔ اجرای محدود، حذف نصب
          # (حذف ~۱۱هزار فایل ممکن است بیش از ۳۰ ثانیه طول بکشد یا فایل لحظه‌ای قفل شود —
          #  دو تلاش با انتظار کامل ۹۰ ثانیه‌ای + دامپ فایل‌های باقیمانده در صورت شکست)
          Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
          # پنجرهٔ کنسول run-server.cmd با pause>nul باز می‌ماند و CWD آن روی INSTDIR است —
          # پوشهٔ ریشه «in use» می‌شود؛ cmdهای مربوط به HotelERP را هدفمند می‌بندیم
          Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" | Where-Object { $_.CommandLine -like '*run-server*' -or $_.CommandLine -like '*HotelERP*' } | ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch {} }
          Start-Sleep -Seconds 2
          schtasks /delete /tn "HotelERP Limited Run" /f 2>$null | Out-Null
          $gone = $false
          for ($attempt = 1; $attempt -le 2 -and -not $gone; $attempt++) {
            if (-not (Test-Path "$inst\Uninstall.exe")) {
              Write-Host "Uninstall.exe vanished before uninstall — likely Defender quarantine of unsigned NSIS uninstaller"
              break
            }
            Start-Process -FilePath "$inst\Uninstall.exe" -ArgumentList "/S" -Wait
            for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; if (-not (Test-Path $inst)) { $gone = $true; break } }
          }
          if (-not $gone -and (Test-Path $inst)) {
            Write-Host "--- leftovers (first 30 paths) ---"
            Get-ChildItem $inst -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty FullName
            try { Get-MpThreatDetection -ErrorAction Stop | Select-Object -First 5 -Property InitialDetectionTime, Resources | Format-List | Out-String | Write-Host } catch { Write-Host "Get-MpThreatDetection unavailable" }
            # رانر باید برای ران بعدی پاک بماند — حذف مستقیم به‌عنوان آخرین راهکار؛
            # زنجیرهٔ اصلی (نصب/دابل‌کلیک/کارکرد) قبلاً کامل سبز شده است.
            for ($r = 0; $r -lt 6 -and (Test-Path $inst); $r++) {
              Remove-Item $inst -Recurse -Force -ErrorAction Continue
              if (Test-Path $inst) { Start-Sleep -Seconds 3 }
            }
            if (Test-Path $inst) { throw "uninstall left files behind in $inst" }
            Write-Host "UNINSTALL OK (fallback removal used — see leftovers/Defender output above)"
          } else {
            Write-Host "UNINSTALL OK — INSTALL / DOUBLE-CLICK / FUNCTIONAL / UNINSTALL all passed"
          }

          # ── باگ #۱۳ — تشخیص نصب قبلی: Setup خاموش روی ماشین نصب‌شده باید «حذف کامل» کند ──
          # ۱) نصب خاموش تازه (ماشین اکنون تمیز است) → باید نصب شود
          # ۲) اجرای دوبارهٔ Setup /S روی همان ماشین → باید نصب قبلی را کامل حذف کند
          Write-Host "BUG13 — reinstall-detection regression: fresh silent install, then silent Setup on installed machine must uninstall"
          $p3 = Start-Process -FilePath "infrastructure\desktop\out\Hotel-ERP-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p3.ExitCode -ne 0) { throw "bug13 fresh Setup /S exited $($p3.ExitCode)" }
          if (-not (Test-Path "$inst\Uninstall.exe")) { throw "bug13 fresh install is missing Uninstall.exe" }
          Write-Host "BUG13 fresh silent install OK — machine is now 'installed'"
          $p4 = Start-Process -FilePath "infrastructure\desktop\out\Hotel-ERP-Setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p4.ExitCode -ne 0) { throw "bug13 detection Setup /S exited $($p4.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $inst) { throw "BUG13 FAILED: second silent Setup on installed machine did NOT uninstall it" }
          $key = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HotelERP" -ErrorAction SilentlyContinue
          if ($key) { throw "BUG13 FAILED: uninstall registry key still present after detection-uninstall" }
          Write-Host "DETECTION OK — installed machine + silent Setup = complete uninstall (bug #13 rule)"

      # ── باگ #۱۴/#۱۵/#۱۶ — رگرسیون چرخهٔ حیات روی ویندوز واقعی ──
      # ۱) PG یتیم: کشتنِ فقط node و نگه‌داشتن postgres → اجرای دوباره باید همان PG را
      #    بازاستفاده کند (نه شروعِ دومین سرور و نه «another server might be running»).
      # ۲) مهاجرت ناتمام (P3009): ردیف unfinished + ستون‌های حذف‌شده → اجرای دوباره باید
      #    خودشان را ترمیم و بازسازی کند (schema-sync).
      # ۳) حذف حین اجرا: برنامه در حال اجرا → Setup /S باید با stop-app.ps1 آن را متوقف
      #    و کامل حذف کند (کد ۰).
      - name: Lifecycle regression — orphan PG reuse, faulted migration heal, uninstall while running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst = "C:\Program Files\HotelERP"
          $data = "$env:APPDATA\HotelERP"
          $setup = "infrastructure\desktop\out\Hotel-ERP-Setup.exe"

          function Dump-Diag {
            Get-ChildItem "$data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 30 }
            Write-Host "--- pg-server.log ---"; Get-Content "$data\logs\pg-server.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host "--- schtasks ---"; schtasks /query /tn "HotelERP Limited Run" /v /fo list 2>$null | Select-Object -Last 12
          }
          function Wait-Healthy($port,$sec){
            for($i=0;$i -lt [int]($sec/2);$i++){ Start-Sleep -Seconds 2; try{ $h=Invoke-RestMethod -Uri "http://localhost:$port/api/v1/health" -TimeoutSec 3; if($h.status -eq 'ok'){return $true} }catch{} }
            return $false
          }
          function Stop-NodeOnly{
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.ToLower().StartsWith($inst.ToLower()) -and $_.Name -eq 'node.exe' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

          # ۱) نصب خاموش تازه
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "lifecycle: fresh Setup /S exited $($p.ExitCode)" }
          if (-not (Test-Path "$inst\HotelERP.exe")) { throw "lifecycle: install missing" }

          # ابزارِ دسترسی مستقیم به PG (پورت از postmaster.pid خوانده می‌شود)
          $pgjs = Join-Path $env:RUNNER_TEMP "pg-probe.js"
          @'
          const fs=require('fs'),{Client}=require(process.argv[2]+'/api/node_modules/pg');
          const pid=fs.readFileSync(process.argv[3]+'/pgdata/postmaster.pid','utf8').split(/\r?\n/);
          const port=Number(pid[3]); const action=process.argv[4];
          const c=new Client({host:'127.0.0.1',port,user:'hotel',password:'hotel_local_pass',database:'hotel_erp',connectionTimeoutMillis:5000});
          (async()=>{ await c.connect();
            if(action==='fault'){ await c.query("UPDATE _prisma_migrations SET finished_at=NULL, rolled_back_at=NULL WHERE migration_name='20261202000000_user_profile_fields'");
              for(const col of ['photoUrl','position','lastLoginAt','lastLoginIp']) await c.query('ALTER TABLE "users" DROP COLUMN IF EXISTS "'+col+'"'); }
            else if(action==='checkcols'){ const r=await c.query("SELECT column_name FROM information_schema.columns WHERE table_name='users' AND column_name IN ('photoUrl','position','lastLoginAt','lastLoginIp')"); console.log('COLS='+r.rows.length); }
            await c.end(); })().catch(e=>{console.error('PGERR',e.message);process.exit(2)});
          '@ | Set-Content -Path $pgjs -Encoding UTF8

          # ۲) اجرا + سلامتی اولیه
          Start-Process -FilePath "$inst\HotelERP.exe"
          if(-not (Wait-Healthy 3000 150)){ Dump-Diag; Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force; throw "lifecycle: app did not become healthy" }
          Write-Host "LIFECYCLE boot OK"

          # ۳) مهاجرت ناتمام (P3009) → ترمیم خودکار + بازسازی ستون‌ها
          & "$inst\node\node.exe" $pgjs $inst $data fault
          Stop-NodeOnly; Start-Sleep -Seconds 3
          Start-Process -FilePath "$inst\HotelERP.exe"
          if(-not (Wait-Healthy 3000 120)){ Dump-Diag; Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force; throw "lifecycle: heal relaunch failed" }
          $cols = & "$inst\node\node.exe" $pgjs $inst $data checkcols
          if($cols -notmatch 'COLS=4'){ Dump-Diag; throw "lifecycle: faulted migration not healed (cols=$cols)" }
          Write-Host "LIFECYCLE faulted-migration heal OK (P3009 self-heal + columns restored)"

          # ۴) PG یتیم: فقط node را بکش، postgres را نگه‌دار → اجرای دوباره باید همان PG را بازاستفاده کند
          Stop-NodeOnly; Start-Sleep -Seconds 3
          $orphan = (Get-Process -Name postgres -ErrorAction SilentlyContinue | Measure-Object).Count
          if($orphan -lt 1){ throw "lifecycle: no orphan postgres after killing node (PG died with node?)" }
          Start-Process -FilePath "$inst\HotelERP.exe"
          if(-not (Wait-Healthy 3000 90)){ Dump-Diag; Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force; throw "lifecycle: orphan-PG reuse relaunch failed" }
          Write-Host "LIFECYCLE orphan-PG reuse OK"
          Stop-NodeOnly; Start-Sleep -Seconds 3

          # ۵) حذف حین اجرا: برنامه دوباره بالا → Setup /S باید با stop-app.ps1 متوقف و کامل حذف کند
          Start-Process -FilePath "$inst\HotelERP.exe"
          if(-not (Wait-Healthy 3000 90)){ Dump-Diag; Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force; throw "lifecycle: pre-uninstall boot failed" }
          $p2 = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if($p2.ExitCode -ne 0){ Dump-Diag; Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force; throw "lifecycle: Setup /S on running app exited $($p2.ExitCode)" }
          Start-Sleep -Seconds 3
          if(Test-Path $inst){ Get-ChildItem $inst -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName; throw "lifecycle: uninstall-while-running left files behind in $inst" }
          $key = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HotelERP" -ErrorAction SilentlyContinue
          if($key){ throw "lifecycle: uninstall registry key still present" }
          Write-Host "LIFECYCLE uninstall-while-running OK — stop-app.ps1 stopped the running server, complete removal, exit 0"
          Get-Process -Name node,postgres -ErrorAction SilentlyContinue | Stop-Process -Force
          schtasks /delete /tn "HotelERP Limited Run" /f 2>$null | Out-Null
          # همهٔ چک‌ها سبز شدند؛ exit صریح تا کد خروجِ دستورِ پاک‌سازیِ انتهایی (schtasks
          # روی وظیفهٔ ازقبل‌حذف‌شده) رنگ این استپ را قرمز نکند.
          exit 0

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-ERP-Setup
          path: infrastructure/desktop/out/Hotel-ERP-Setup.exe
          if-no-files-found: error

      - name: Attach Setup.exe to the GitHub Release of this tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: infrastructure/desktop/out/Hotel-ERP-Setup.exe
